<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>samleo interactive</title>
    <!-- Tailwind CSS CDN -->\
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 10s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 8s ease-in-out infinite',
                        'glow': 'glow 5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { opacity: '0.3', transform: 'scale(0.98)' },
                            '100%': { opacity: '0.75', transform: 'scale(1.05)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #08090d;
            color: #f3f4f6;
            overflow: hidden;
        }

        /* Ambient grid pattern background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Radial mask overlay for subtle fading grid towards edges */
        .grid-mask {
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Elegant shimmering gradient text animation */
        .gradient-text-shimmer {
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #c7d2fe 30%, 
                #818cf8 50%, 
                #e0e7ff 70%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between items-center relative select-none p-6 sm:p-12">

    <!-- Ambient Light Orbs -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] sm:w-[700px] h-[500px] sm:h-[700px] bg-indigo-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse-slow"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] sm:w-[500px] h-[350px] sm:h-[500px] bg-purple-600/15 rounded-full blur-[100px] pointer-events-none animate-glow"></div>

    <!-- Subtle Grid Background -->
    <div class="absolute inset-0 bg-grid grid-mask pointer-events-none opacity-60"></div>

    <!-- Header Spacer for Flex Alignment -->
    <div></div>

    <!-- Center Branding Title -->
    <main class="relative z-10 text-center animate-float my-auto">
        <h1 class="text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-black tracking-tight leading-none">
            <span class="text-white font-extrabold tracking-tight">samleo</span> 
            <span class="gradient-text-shimmer font-light tracking-normal">interactive</span>
        </h1>
    </main>

    <!-- Minimalist Footer Email Link -->
    <footer class="relative z-10 text-center pb-2 sm:pb-4">
        <div class="inline-flex items-center gap-2 group">
            <a href="mailto:samleointeractive@gmail.com" 
               class="text-xs sm:text-sm tracking-widest text-zinc-400 hover:text-indigo-300 transition-colors duration-300 font-mono flex items-center gap-2 px-4 py-2 rounded-full border border-white/5 hover:border-indigo-500/30 bg-white/[0.02] hover:bg-white/[0.05] backdrop-blur-sm shadow-lg shadow-black/40">
                <svg class="w-3.5 h-3.5 opacity-60 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <span>samleointeractive@gmail.com</span>
            </a>
            <button onclick="copyEmail(this)" 
                    title="Copy to clipboard"
                    class="p-2 text-zinc-500 hover:text-indigo-300 rounded-full border border-white/5 hover:border-indigo-500/30 bg-white/[0.02] hover:bg-white/[0.05] backdrop-blur-sm transition-colors duration-300">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>
        </div>
        <!-- Toast message -->
        <div id="toast" class="opacity-0 transition-opacity duration-300 text-[11px] text-indigo-400 font-mono mt-2 h-4">
            Copied to clipboard
        </div>
    </footer>

    <script>
        function copyEmail(btn) {
            const email = 'samleointeractive@gmail.com';
            const textarea = document.createElement('textarea');
            textarea.value = email;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
